<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 386" role="img" aria-labelledby="title desc">
  <title id="title">QD35 MCP</title>
  <desc id="desc">Local control for the Edifier QD35. An illustrated speaker has a warm illuminated ring, an amber light strip, and a clock reading 09:00.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111722"/>
      <stop offset="1" stop-color="#171826"/>
    </linearGradient>
    <radialGradient id="dawn" cx="77%" cy="52%" r="48%">
      <stop stop-color="#63334a" stop-opacity=".78"/>
      <stop offset="1" stop-color="#4d2b46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinet" x2="1" y2="1">
      <stop stop-color="#4e4b63"/>
      <stop offset=".45" stop-color="#252839"/>
      <stop offset="1" stop-color="#252330"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#262b3a"/>
      <stop offset="1" stop-color="#171923"/>
    </linearGradient>
    <linearGradient id="light" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#f78962"/>
      <stop offset=".53" stop-color="#ffc188"/>
      <stop offset="1" stop-color="#f18ba1"/>
    </linearGradient>
    <radialGradient id="driver">
      <stop stop-color="#393749"/>
      <stop offset=".7" stop-color="#272837"/>
      <stop offset="1" stop-color="#171923"/>
    </radialGradient>
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r=".98" fill="#6d687b" opacity=".46"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#d9c1ce" opacity=".17"/>
    </pattern>
    <filter id="glow" x="-35%" y="-75%" width="170%" height="250%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frame"><rect width="1160" height="386" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1160" height="386" fill="url(#background)"/>
    <rect width="1160" height="386" fill="url(#dawn)"/>
    <path d="M694 0h466v386H590z" fill="url(#grid)"/>
    <path d="M652 386 813 0m-30 386L944 0m-30 386L1075 0m-26 386L1160 119" fill="none" stroke="#c093b5" stroke-opacity=".10"/>

    <g font-family="system-ui, -apple-system, sans-serif">
      <text x="65" y="94" fill="#ffa987" font-size="19" font-weight="700" letter-spacing="2">LOCAL CONTROL FOR EDIFIER QD35</text>
      <text x="60" y="174" fill="#fff4ec" font-size="87" font-weight="800" letter-spacing="-4">QD35 <tspan fill="#ffc396">MCP</tspan></text>
      <text x="66" y="228" fill="#e6dfe8" font-size="29" font-weight="600">Speaker controls for your agent.</text>
      <path d="M67 269h48" stroke="#f5a67c" stroke-width="3" stroke-linecap="round"/>
      <text x="66" y="316" fill="#c6bcca" font-size="21">Audio  ·  RGB lighting  ·  Sunrise alarms</text>
    </g>

    <ellipse cx="885" cy="327" rx="164" ry="15" fill="#0c0e16" opacity=".7" filter="url(#glow)"/>
    <path d="M984 75l37 23q9 6 9 17v181q0 12-11 18l-32 15V75z" fill="#2b2938" stroke="#706077" stroke-width="2"/>
    <path d="M1009 119v174" stroke="#83738a" opacity=".35"/>
    <rect x="730" y="70" width="273" height="258" rx="26" fill="url(#cabinet)" stroke="#7b6d83" stroke-width="2"/>
    <rect x="742" y="81" width="249" height="235" rx="19" fill="url(#glass)" stroke="#827185" stroke-opacity=".43"/>
    <path d="M751 134v-32q0-12 13-12h165" fill="none" stroke="#c5a2b1" stroke-opacity=".36" stroke-linecap="round"/>
    <circle cx="867" cy="178" r="71" fill="none" stroke="#ff976b" stroke-width="19" opacity=".56" filter="url(#glow)"/>
    <circle cx="867" cy="178" r="70" fill="#212031" stroke="url(#light)" stroke-width="5"/>
    <circle cx="867" cy="178" r="61" fill="url(#driver)" stroke="#77657c" stroke-width="1.5"/>
    <circle cx="867" cy="178" r="59" fill="url(#mesh)"/>
    <circle cx="867" cy="178" r="34" fill="none" stroke="#b2a3b1" stroke-opacity=".15"/>
    <circle cx="867" cy="178" r="23" fill="#3b3748" stroke="#534b60"/>
    <path d="M767 291q49 14 101 14 50 0 97-14" fill="none" stroke="#f39062" stroke-width="14" opacity=".59" filter="url(#glow)"/>
    <path d="M767 291q49 14 101 14 50 0 97-14" fill="none" stroke="url(#light)" stroke-width="4" stroke-linecap="round"/>
    <text x="867" y="277" fill="#ffe3bb" font-family="monospace" font-size="27" font-weight="700" letter-spacing="3" text-anchor="middle">09:00</text>
    <circle cx="1016" cy="160" r="6" fill="#191923" stroke="#87748c"/>
    <circle cx="1016" cy="192" r="6" fill="#191923" stroke="#87748c"/>
  </g>
  <rect x=".75" y=".75" width="1158.5" height="384.5" rx="27" fill="none" stroke="#cdb2c6" stroke-opacity=".24" stroke-width="1.5"/>
</svg>
