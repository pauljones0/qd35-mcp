[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qd35-mcp"
version = "0.1.0"
description = "Local MCP server for controlling the Edifier QD35 over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QD35 MCP contributors" }]
keywords = ["edifier", "qd35", "bluetooth", "ble", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "bleak==3.1.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
]

[project.scripts]
qd35-mcp = "qd35_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/pauljones0/qd35-mcp"
Issues = "https://github.com/pauljones0/qd35-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qd35_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]

